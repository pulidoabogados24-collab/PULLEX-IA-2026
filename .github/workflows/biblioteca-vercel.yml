name: Biblioteca Vercel — regresion
on:
  pull_request:
    branches: [main]
    paths:
      - biblioteca.py
      - tests/test_biblioteca_vercel.py
      - tests/test_biblioteca.py
      - tests/test_biblioteca_catalogo.py
      - tests/test_seguridad.py
      - tests/test_regresion.py
      - .github/workflows/biblioteca-vercel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biblioteca:
    name: SQLite readonly y rutas privadas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sin credenciales persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Dependencias de pruebas (sin secretos)
        run: python -m pip install -r requirements.txt pytest==9.1.1 httpx==0.28.1
      - name: Suite relevante
        run: python -m pytest tests/test_biblioteca_vercel.py tests/test_biblioteca.py tests/test_biblioteca_catalogo.py tests/test_seguridad.py tests/test_regresion.py -q
