name: Auditoria de datos y recuperacion

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditoria-datos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  datos:
    name: Datos (${{ matrix.motor }}, PG ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - motor: sqlite
            pg: 16
          - motor: postgres
            pg: 16
          - motor: postgres
            pg: 17
    # Servicio desechable, sin datos ni credenciales de produccion.
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: pullex_test
          POSTGRES_PASSWORD: solo-ci-desechable
          POSTGRES_DB: pullex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullex_test -d pullex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PULLEX_PRUEBAS_PG_URL: ${{ matrix.motor == 'postgres' && 'postgresql://pullex_test:solo-ci-desechable@127.0.0.1:5432/pullex_test' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Dependencias fijadas y herramientas de recuperacion
        run: |
          python -m pip install -r requirements.lock pytest==9.1.1 httpx==0.28.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-${{ matrix.pg }}
          echo "/usr/lib/postgresql/${{ matrix.pg }}/bin" >> "$GITHUB_PATH"
      - name: Suite completa de pruebas unitarias y de API
        run: python -m pytest tests -q --junitxml=resultados/suite.xml
      - name: Restauracion real en PostgreSQL desechable (clara y cifrada)
        if: always() && matrix.motor == 'postgres'
        run: |
          python -m pytest tests/test_seguridad_datos.py::test_pg_respaldar_borrar_y_restaurar_deja_los_mismos_datos -q --junitxml=resultados/restauracion.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          casos = list(ET.parse('resultados/restauracion.xml').iter('testcase'))
          assert len(casos) == 2, 'Deben ejecutarse las dos variantes de restauracion'
          assert all(len(caso) == 0 for caso in casos), 'No se aceptan omisiones ni fallos en restauracion'
          PY
      - name: Conservar resultados de pruebas (sin volcados ni secretos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auditoria-${{ matrix.motor }}-pg${{ matrix.pg }}-${{ github.run_id }}
          path: resultados/*.xml
          if-no-files-found: error
          retention-days: 14
