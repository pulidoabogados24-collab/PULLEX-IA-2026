<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULLEX IA — Administración</title>
<style>
:root{--azul:#0A1E3F;--azul2:#0E2A57;--azul3:#12356e;--linea:#1c3f74;--oro:#FFC93C;--oro2:#FDB813;
  --txt:#eaf0fb;--txt2:#a9bad6;--ok:#39d98a;--mal:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--azul);color:var(--txt)}
.tricolor{height:4px;background:linear-gradient(90deg,var(--oro) 0 33%,#0033a0 33% 66%,#ce1126 66% 100%)}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--azul2);border-bottom:1px solid var(--linea)}
header b{color:var(--oro)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px}
.card{background:var(--azul2);border:1px solid var(--linea);border-radius:16px;padding:22px;max-width:400px;margin:8vh auto}
.inp{width:100%;padding:12px 13px;border-radius:11px;background:var(--azul);border:1px solid var(--linea);color:var(--txt);font-size:15px;outline:none;margin-top:6px}
.btn{padding:12px 16px;border-radius:11px;background:linear-gradient(180deg,var(--oro),var(--oro2));color:#20170a;font-weight:800;border:0;cursor:pointer;font-size:14px}
.msg{color:var(--mal);font-size:13px;min-height:16px;margin-top:8px}
label{font-size:12px;color:var(--txt2)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--azul2);border:1px solid var(--linea);border-radius:14px;padding:14px 18px;flex:1;min-width:120px}
.stat .n{font-size:24px;font-weight:800;color:var(--oro)}.stat .l{font-size:12px;color:var(--txt2)}
table{width:100%;border-collapse:collapse;background:var(--azul2);border-radius:14px;overflow:hidden;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--linea)}
th{background:var(--azul3);font-size:12px;color:var(--txt2)}
select,input.min{background:var(--azul);border:1px solid var(--linea);color:var(--txt);border-radius:8px;padding:6px 8px;font-size:12px}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.on-p{background:rgba(57,217,138,.15);color:var(--ok)}.off-p{background:rgba(255,107,107,.15);color:var(--mal)}
.bx{padding:6px 11px;border-radius:8px;background:var(--oro);color:#20170a;font-weight:700;border:0;cursor:pointer;font-size:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top button{padding:9px 13px;border-radius:10px;background:var(--azul2);border:1px solid var(--linea);color:var(--txt);cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="tricolor"></div>
<header><b>PULLEX</b> IA · Panel de administración</header>

<div id="login" class="card">
  <h3 style="margin-top:0">Ingreso de administrador</h3>
  <label>Correo</label><input id="e" class="inp" type="email">
  <label>Contraseña</label><input id="c" class="inp" type="password">
  <div id="msg" class="msg"></div>
  <button class="btn" style="width:100%;margin-top:12px" data-click="entrar">Ingresar</button>
</div>

<div id="panel" class="wrap" style="display:none">
  <div class="top">
    <button data-click="cargar">↻ Refrescar</button>
    <button data-click="regenBoletin">📅 Regenerar boletín</button>
    <a href="/" style="margin-left:auto;color:var(--oro)">← Ir a la app</a>
  </div>
  <div class="stats" id="stats"></div>
  <div class="stats" id="negocio"></div>
  <table>
    <thead><tr><th>Estudiante</th><th>Plan</th><th>Uso</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
