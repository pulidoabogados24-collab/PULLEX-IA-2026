<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PULLEX IA — Administración</title>
<style>
:root{--azul:#0A1E3F;--azul2:#0E2A57;--azul3:#12356e;--linea:#1c3f74;--oro:#FFC93C;--oro2:#FDB813;
  --txt:#eaf0fb;--txt2:#a9bad6;--ok:#39d98a;--mal:#ff6b6b}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--azul);color:var(--txt)}
.tricolor{height:4px;background:linear-gradient(90deg,var(--oro) 0 33%,#0033a0 33% 66%,#ce1126 66% 100%)}
header{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--azul2);border-bottom:1px solid var(--linea)}
header b{color:var(--oro)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px}
.card{background:var(--azul2);border:1px solid var(--linea);border-radius:16px;padding:22px;max-width:400px;margin:8vh auto}
.inp{width:100%;padding:12px 13px;border-radius:11px;background:var(--azul);border:1px solid var(--linea);color:var(--txt);font-size:15px;outline:none;margin-top:6px}
.btn{padding:12px 16px;border-radius:11px;background:linear-gradient(180deg,var(--oro),var(--oro2));color:#20170a;font-weight:800;border:0;cursor:pointer;font-size:14px}
.msg{color:var(--mal);font-size:13px;min-height:16px;margin-top:8px}
label{font-size:12px;color:var(--txt2)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--azul2);border:1px solid var(--linea);border-radius:14px;padding:14px 18px;flex:1;min-width:120px}
.stat .n{font-size:24px;font-weight:800;color:var(--oro)}.stat .l{font-size:12px;color:var(--txt2)}
table{width:100%;border-collapse:collapse;background:var(--azul2);border-radius:14px;overflow:hidden;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--linea)}
th{background:var(--azul3);font-size:12px;color:var(--txt2)}
select,input.min{background:var(--azul);border:1px solid var(--linea);color:var(--txt);border-radius:8px;padding:6px 8px;font-size:12px}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.on-p{background:rgba(57,217,138,.15);color:var(--ok)}.off-p{background:rgba(255,107,107,.15);color:var(--mal)}
.bx{padding:6px 11px;border-radius:8px;background:var(--oro);color:#20170a;font-weight:700;border:0;cursor:pointer;font-size:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top button{padding:9px 13px;border-radius:10px;background:var(--azul2);border:1px solid var(--linea);color:var(--txt);cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div class="tricolor"></div>
<header><b>PULLEX</b> IA · Panel de administración</header>

<div id="login" class="card">
  <h3 style="margin-top:0">Ingreso de administrador</h3>
  <label>Correo</label><input id="e" class="inp" type="email">
  <label>Contraseña</label><input id="c" class="inp" type="password">
  <div id="msg" class="msg"></div>
  <button class="btn" style="width:100%;margin-top:12px" onclick="entrar()">Ingresar</button>
</div>

<div id="panel" class="wrap" style="display:none">
  <div class="top">
    <button onclick="cargar()">↻ Refrescar</button>
    <button onclick="regenBoletin()">📅 Regenerar boletín</button>
    <a href="/" style="margin-left:auto;color:var(--oro)">← Ir a la app</a>
  </div>
  <div class="stats" id="stats"></div>
  <div class="stats" id="negocio"></div>
  <table>
    <thead><tr><th>Estudiante</th><th>Plan</th><th>Uso</th><th>Estado</th><th>Acción</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
</div>

<script>
const $=id=>document.getElementById(id);let TOKEN=null,PLANES={};
async function entrar(){
  $('msg').textContent='';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email:$('e').value.trim(),clave:$('c').value})});
    const d=await r.json();
    if(!r.ok){$('msg').textContent=d.detail||'No se pudo';return}
    if(!d.perfil.es_admin){$('msg').textContent='Esta cuenta no es de administrador';return}
    TOKEN=d.token;$('login').style.display='none';$('panel').style.display='block';cargar();
  }catch(e){$('msg').textContent='Error de conexión'}
}
async function cargar(){
  const d=await(await fetch('/api/admin/usuarios',{headers:{'Authorization':'Bearer '+TOKEN}})).json();
  PLANES=d.planes;const us=d.usuarios;
  const activos=us.filter(u=>u.activo&&!u.es_admin).length;
  const total=us.filter(u=>!u.es_admin).length;
  const pagos=us.filter(u=>u.plan!=='prueba'&&!u.es_admin).length;
  $('stats').innerHTML=`
    <div class="stat"><div class="n">${total}</div><div class="l">Estudiantes</div></div>
    <div class="stat"><div class="n">${activos}</div><div class="l">Activos</div></div>
    <div class="stat"><div class="n">${pagos}</div><div class="l">Con plan pago</div></div>`;
  cargarNegocio();
  const tb=$('tb');tb.innerHTML='';
  us.forEach(u=>{
    const tr=document.createElement('tr');
    const opts=Object.keys(PLANES).map(k=>`<option value="${k}" ${u.plan===k?'selected':''}>${PLANES[k].nombre}</option>`).join('');
    tr.innerHTML=`
      <td>${u.nombre}<br><span style="color:var(--txt2);font-size:11px">${u.email}</span>${u.es_admin?' 👑':''}</td>
      <td><select class="min" id="p-${u.email}">${opts}</select></td>
      <td>${u.usadas}/${u.limite}</td>
      <td><span class="pill ${u.activo?'on-p':'off-p'}" id="s-${u.email}">${u.activo?'Activo':'Inactivo'}</span></td>
      <td>
        <button class="bx" onclick="guardar('${u.email}',true)">Activar</button>
        <button class="bx" style="background:var(--azul3);color:var(--txt)" onclick="guardar('${u.email}',false)">Desactivar</button>
        <button class="bx" style="background:var(--azul3);color:var(--txt)" onclick="guardar('${u.email}',null,true)">Reiniciar uso</button>
        <button class="bx" style="background:var(--azul3);color:var(--txt)" onclick="resetClave('${u.email}')">🔑 Clave</button>
      </td>`;
    tb.appendChild(tr);
  });
}
async function cargarNegocio(){
  try{
    const m=await(await fetch('/api/admin/metricas',{headers:{'Authorization':'Bearer '+TOKEN}})).json();
    const cop=n=>'$'+Number(n||0).toLocaleString('es-CO');
    $('negocio').innerHTML=`
      <div class="stat"><div class="n" style="color:var(--ok)">${cop(m.ingreso_mensual_estimado)}</div><div class="l">Ingreso mensual estimado</div></div>
      <div class="stat"><div class="n" style="color:#ff9f43">${cop(m.costo_api_estimado)}</div><div class="l">Costo API estimado</div></div>
      <div class="stat"><div class="n">${cop(m.margen_estimado)}</div><div class="l">Margen estimado</div></div>
      <div class="stat"><div class="n">${m.consultas_totales}</div><div class="l">Consultas usadas</div></div>`;
  }catch(e){$('negocio').innerHTML=''}
}
async function resetClave(email){
  if(!confirm('¿Generar una contraseña temporal para '+email+'?'))return;
  const r=await fetch('/api/admin/reset-clave',{method:'POST',
    headers:{'Authorization':'Bearer '+TOKEN,'content-type':'application/json'},body:JSON.stringify({email})});
  const d=await r.json();
  if(r.ok)prompt('Entrégale esta contraseña temporal al estudiante (la cambia al entrar):',d.temporal);
  else alert('No se pudo');
}
async function guardar(email,activo,reiniciar){
  const plan=$('p-'+email).value;
  const body={email,plan};
  if(activo!==null&&activo!==undefined)body.activo=activo;
  if(reiniciar)body.reiniciar=true;
  const r=await fetch('/api/admin/actualizar',{method:'POST',
    headers:{'Authorization':'Bearer '+TOKEN,'content-type':'application/json'},body:JSON.stringify(body)});
  if(r.ok)cargar();else alert('No se pudo actualizar');
}
async function regenBoletin(){
  await fetch('/api/admin/boletin/regenerar',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN}});
  alert('Boletín regenerado');
}
</script>
</body>
</html>
